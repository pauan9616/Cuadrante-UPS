<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cuadrante</title>

<!-- Permite "Añadir a pantalla de inicio" en iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cuadrante" />
<meta name="theme-color" content="#12213A" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.json" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
  <h1 id="page-title">Cuadrante</h1>
  <div class="topbar-actions">
    <select id="month-select" hidden></select>
    <button id="login-btn" class="btn btn-ghost">Acceder</button>
    <button id="logout-btn" class="btn btn-ghost" hidden>Salir</button>
  </div>
</header>

<section id="admin-panel" class="admin-panel" hidden>
  <h2>Publicar nuevo cuadrante</h2>
  <p class="hint">Sube el Excel del mes. Se leerá automáticamente y podrás revisarlo antes de publicarlo.</p>
  <div class="admin-row">
    <input type="file" id="file-input" accept=".xls,.xlsx" />
    <input type="text" id="month-label" placeholder="Ej. Septiembre 2026" />
    <button id="publish-btn" class="btn btn-primary" disabled>Publicar</button>
  </div>
  <p id="publish-status" class="hint"></p>
</section>

<dialog id="login-modal">
  <form id="login-form" method="dialog">
    <h2>Acceso administrador</h2>
    <label>Correo<input type="email" id="login-email" required autocomplete="username" /></label>
    <label>Contraseña<input type="password" id="login-password" required autocomplete="current-password" /></label>
    <p id="login-error" class="error"></p>
    <div class="dialog-actions">
      <button type="button" id="cancel-login" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </div>
  </form>
</dialog>

<div id="legend" class="legend"></div>

<main id="cuadrante" class="cuadrante"></main>

<p id="empty-state" class="hint empty-state" hidden>
  Todavía no hay ningún cuadrante publicado. Cuando el administrador suba el primero, aparecerá aquí.
</p>

<script type="module" src="js/app.js"></script>
</body>
</html>
